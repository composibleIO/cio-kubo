[package]
name = "cioKubo"
version = "0.1.0"
edition = "2018"

[[bin]]
name = "cioKubo"
path = "src/main.rs"

[dependencies]
marine-rs-sdk = { version = "0.14.0", features = ["logger"] }
cio-ipfs-effector-imports = { git = "https://github.com/composibleIO/cio-ipfs-effector", branch = "main" }
ipfs-effector-imports = { git = "https://github.com/fluencelabs/ipfs-effector", branch = "main" }

cio-response-types = { git = "https://github.com/composibleIO/cio-response-types", branch = "main" }
chrono = "0.4"
log = "0.4.22"

[dev-dependencies]
marine-rs-sdk-test = "0.16.1"
